events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    server {
        listen 80;
        server_name _;

        location = /internal/mcp {
            return 404;
        }

        location ^~ /internal/mcp/ {
            return 404;
        }

        # Do not advertise the OAuth-protected /mcp resource to authless
        # legacy connectors when their path-specific discovery falls back.
        location = /.well-known/oauth-protected-resource {
            return 404;
        }

        location = /.well-known/oauth-protected-resource/mcp {
            set $mcp_aklara_upstream http://mcp-aklara:8000;
            proxy_pass $mcp_aklara_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /.well-known/oauth-protected-resource/mcp/ {
            set $mcp_aklara_upstream http://mcp-aklara:8000;
            proxy_pass $mcp_aklara_upstream/.well-known/oauth-protected-resource/mcp;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location = /mcp {
            set $mcp_aklara_upstream http://mcp-aklara:8000;
            proxy_pass $mcp_aklara_upstream/mcp/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ^~ /mcp/ {
            set $mcp_aklara_upstream http://mcp-aklara:8000;
            proxy_pass $mcp_aklara_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Temporary legacy MCP endpoint. The API key is part of the URL, so
        # accept only URL-safe keys and keep the request out of access logs.
        location ~ ^/mcp-key-[A-Za-z0-9_-]+/sse/?$ {
            access_log off;
            set $mcp_aklara_upstream http://mcp-aklara:8000;
            proxy_pass $mcp_aklara_upstream;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            set $flask_powerbi_upstream http://flask-powerbi:2052;
            proxy_pass $flask_powerbi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
