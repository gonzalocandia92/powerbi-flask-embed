<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- PDF reports: the display font stack is "Georgia, 'Times New Roman', serif". Georgia is not
     installable here, and without this rule fontconfig answers it with DejaVu Serif, a much wider face
     that changes line wrapping and heights. Use the metric-compatible Times New Roman substitute. -->
<fontconfig>
  <alias binding="same">
    <family>Georgia</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
</fontconfig>
