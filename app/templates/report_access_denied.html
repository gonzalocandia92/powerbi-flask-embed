<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin acceso - {{ config_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-warning">
                        <h4 class="mb-0">Sin acceso a este reporte</h4>
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">{{ config_name }}</h5>
                        <p class="card-text">
                            Su usuario ({{ current_user.username }}) no tiene permiso para ver este reporte.
                        </p>
                        <p class="card-text text-muted">
                            Si cree que debería tener acceso, pídale al administrador que lo asocie con la empresa
                            correspondiente. También puede ingresar con otro usuario.
                        </p>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-primary">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
