<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sesión iniciada - Sudata PBI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header">
                        <h4 class="mb-0">Sesión iniciada</h4>
                    </div>
                    <div class="card-body">
                        <p class="card-text">Hola, {{ current_user.username }}.</p>
                        <p class="card-text text-muted">
                            Para ver un reporte, abra el enlace que le compartieron.
                            Cuando esté disponible, el listado de sus reportes aparecerá en esta página.
                        </p>
                        <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary">Cerrar sesión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
